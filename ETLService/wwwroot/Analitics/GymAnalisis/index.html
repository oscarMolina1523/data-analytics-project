<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Dashboard Analítico Fitness</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module" src="./script.js"></script>

    <style>

        body{
            font-family: Arial;
            margin:20px;
            background:#f5f5f5;
        }

        .panel{
            background:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:20px;
        }

        select,input,button{
            padding:8px;
            margin:5px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        td,th{
            border:1px solid #ddd;
            padding:8px;
        }

        canvas{
            background:white;
            padding:20px;
        }

        #loading{
            padding:20px;
            font-weight:bold;
            color:#2563eb;
        }

    </style>

</head>

<body>

    <h1>Dashboard Analítico Fitness</h1>

    <div class="panel">

        <label>Hipótesis</label>

        <select id="hipotesis"></select>

        <label>Desde</label>
        <input type="date" id="desde">

        <label>Hasta</label>
        <input type="date" id="hasta">

        <br>

        <label>Agrupar por</label>
        <select id="groupParam"></select>

        <label>Métrica</label>
        <select id="evalParam"></select>

        <button id="btnConsultar">
            Consultar
        </button>

        <div id="loading" style="display:none">
            Consultando...
        </div>

    </div>

    <div class="panel">

        <h2>Gráfico</h2>

        <canvas id="chart"></canvas>

    </div>

    <div class="panel">

        <h2>Resultados</h2>

        <div id="tableContainer"></div>

    </div>

    <div class="panel">

        <h2>Prueba Estadística</h2>

        <div id="hipotesisContainer"></div>

    </div>

</body>
</html>
